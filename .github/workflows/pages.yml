# Publishes the game to GitHub Pages on every push to main.
# Only the files the game needs are copied into the site (an allowlist), so notes like
# CLAUDE.md and README, the scanned drawings in assets/scans and the dev tools stay off
# the public website.

name: GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Collect game files
        run: |
          mkdir -p _site/assets
          cp index.html style.css manifest.webmanifest sw.js .nojekyll _site/
          cp -r src _site/
          cp -r assets/icons _site/assets/
          # Only songs committed to git (freely licensed ones) end up here; the game
          # hides the note button when there are none.
          if [ -d assets/music ]; then cp -r assets/music _site/assets/; fi
          find _site -type f | sort

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
