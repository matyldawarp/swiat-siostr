<!doctype html>
<html lang="pl">
<head>
    <meta charset="utf-8">
    <!-- viewport-fit=cover and black-translucent let the game draw under the iPad's status
         bar when started from the home screen, instead of leaving a white strip there. -->
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>Świat Sióstr</title>
    <link rel="manifest" href="manifest.webmanifest">
    <meta name="theme-color" content="#fff4f8">
    <link rel="icon" type="image/png" href="assets/icons/icon-192.png">
    <link rel="apple-touch-icon" href="assets/icons/icon-192.png">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-title" content="Świat Sióstr">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Handjet:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="game"></div>
    <!-- Solid strip under the status bar of the home-screen app. Without it iPadOS 27
         blurs the top of the game there (style.css). -->
    <div id="status-bar"></div>
    <!-- Measures the safe area (status bar, rounded corners) for the overlay buttons. -->
    <div id="safe-area"></div>
    <!-- In debug mode (Settings) the game's errors show in the bottom-right corner, so they
         can be read off a device. Plain script first, so it catches errors even when the
         game's own code fails to load. -->
    <div id="errors" style="display:none;position:fixed;right:8px;bottom:8px;max-width:60%;max-height:40%;overflow:auto;padding:6px 8px;background:#ffffff;color:#7a3f63;font:14px Arial,Helvetica,sans-serif;white-space:pre-wrap;z-index:10;"></div>
    <script>
        (function () {
            var debug = false;
            try {
                debug = Boolean((JSON.parse(localStorage.getItem('swiat-siostr-settings')) || {}).debug);
            } catch (e) {
                debug = false;
            }
            function show(text) {
                if (!debug) {
                    return;
                }
                var box = document.getElementById('errors');
                box.style.display = 'block';
                box.textContent += (box.textContent ? '\n' : '') + text;
            }
            window.addEventListener('error', function (event) {
                var where = event.filename ? ' (' + event.filename.split('/').slice(-2).join('/') + ':' + event.lineno + ')' : '';
                show('Błąd: ' + (event.message || (event.target && event.target.src) || event) + where);
            }, true);
            window.addEventListener('unhandledrejection', function (event) {
                show('Błąd: ' + (event.reason && (event.reason.stack || event.reason.message) || event.reason));
            });
        })();
    </script>
    <script src="https://cdn.jsdelivr.net/npm/phaser@4.2.1/dist/phaser.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/nosleep.js@0.12.0/dist/NoSleep.min.js"></script>
    <!-- Game code is ES modules: main.js imports everything else. -->
    <script type="module" src="src/main.js"></script>
</body>
</html>
